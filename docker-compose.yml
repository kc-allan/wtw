services:
  postgres:
    image: postgres:16-alpine
    container_name: wtw-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wtw
      POSTGRES_PASSWORD: wtw
      POSTGRES_DB: worththewait
    # 5434 on the host to stay clear of other local Postgres instances.
    ports:
      - '5434:5432'
    volumes:
      - wtw-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wtw -d worththewait']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  wtw-postgres-data:
